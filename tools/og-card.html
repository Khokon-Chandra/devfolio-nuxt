<!doctype html>
<!--
  Source for public/og-image.jpg — the 1200x630 social share card.
  Regenerate after changing your name, role, stack or photo:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=9000 \
      --screenshot=og-raw.png "file://$PWD/tools/og-card.html"
    sips -s format jpeg -s formatOptions 88 og-raw.png --out public/og-image.jpg
    rm og-raw.png

  Keep it 1200x630. Below roughly that size LinkedIn, Facebook and WhatsApp
  downgrade the preview to a small square thumbnail.
-->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:"Nunito Sans",-apple-system,"Segoe UI",sans-serif;
    background:#f7f8fc;position:relative;display:flex;align-items:center}
  .wash{position:absolute;inset:0;overflow:hidden}
  .wash i{position:absolute;border-radius:9999px;filter:blur(90px);display:block}
  .w1{width:520px;height:520px;top:-190px;right:-110px;background:rgba(239,68,68,.16)}
  .w2{width:520px;height:520px;bottom:-240px;left:-150px;background:rgba(66,184,131,.16)}
  .inner{position:relative;display:flex;align-items:center;justify-content:space-between;
    width:100%;height:630px;padding:0 72px;gap:44px}
  .badge{display:inline-flex;align-items:center;gap:10px;border:1px solid #e2e5ee;background:#fff;
    border-radius:9999px;padding:9px 20px;font-size:15px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:#55617a}
  .dot{width:9px;height:9px;border-radius:9999px;background:#10b981;display:block}
  h1{margin-top:26px;font-size:72px;line-height:1.03;font-weight:900;letter-spacing:-.025em;color:#1a2230}
  .role{margin-top:14px;font-size:31px;font-weight:800;color:#3d4759}
  .stack{margin-top:16px;font-size:26px;font-weight:800;color:#8a93a6}
  .laravel{color:#FF2D20}.vue{color:#42B883}.plus{color:#c3c9d6}
  .url{margin-top:34px;display:inline-flex;align-items:center;gap:12px;font-size:21px;font-weight:800;color:#55617a}
  .url b{color:#ef4444;font-weight:900}
  .photo{position:relative;flex:0 0 auto;width:452px;height:452px}
  .halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:520px;height:520px;border-radius:9999px;
    background:radial-gradient(circle,rgba(239,68,68,.28),rgba(66,184,131,.22) 58%,transparent 74%);
    filter:blur(30px)}
  .photo img{position:relative;width:452px;height:452px;border-radius:9999px;object-fit:cover;
    object-position:center 22%;display:block;border:10px solid #fff;
    box-shadow:0 26px 64px rgba(26,34,48,.20)}
</style></head>
<body>
  <div class="wash"><i class="w1"></i><i class="w2"></i></div>
  <div class="inner">
    <div>
      <span class="badge"><span class="dot"></span>Available for remote work</span>
      <h1>Khokon Chandra</h1>
      <div class="role">Remote Full-Stack Developer</div>
      <div class="stack">
        <span class="laravel">Laravel</span> <span class="plus">+</span>
        <span class="vue">Vue&nbsp;3</span> <span class="plus">·</span> Nuxt 3 · TypeScript
      </div>
      <div class="url"><b>khokon.vercel.app</b> · Fiverr · Upwork · Freelancer</div>
    </div>
    <div class="photo">
      <div class="halo"></div>
      <img src="../public/khokon-chandra.jpg" alt="">
    </div>
  </div>
</body></html>
